<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGPA Calculator</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <script src="script1.js"></script>
    <div class="header">
        <!-- <div class="logo">HB</div> -->
        <div class="logo">
            <img src="logo.png" alt="Logo" style="width: 30px; height: 30px;">
        </div>
        <button class="menu-btn" onclick="toggleMenu()">☰</button>
    </div>

    <div class="menu" id="menu">
        <a href="index.html">SGPA Calculator</a>
        <a href="page1.html">CGPA Calculator</a>
    </div>

    <div class="container">
        <h1>SGPA Calculator</h1>

        <form id="gpaForm">
            <div id="courseList">
                <!-- Courses will be dynamically added here -->
            </div>

            <button type="button" class="calc" onclick="calculateGPA()">Calculate SGPA</button>
            <button type="button" id="editToggleBtn" class="edit-btn" onclick="toggleEdit()">Edit Courses</button>

            <div class="result" id="result"></div>
        </form>

        <div class="edit-container" id="editContainer">
            <h2>Edit Courses and Credits</h2>
            <div id="editCourseList">
                <!-- Editable courses will be dynamically added here -->
            </div>
            <button type="button" class="edit-btn" onclick="addCourse()">Add Course</button>
            <button type="button" class="edit-btn" onclick="saveChanges()">Save Changes</button>

            <!-- New Branches Section -->
            <div id="branches">
                <h3>Branches (BMSCE)</h3>
                <button type="button" class="branch-btn" onclick="selectBranch('ECE')">ECE</button>
                <button type="button" class="branch-btn" onclick="selectBranch('EEE')">EEE</button>
                <button type="button" class="branch-btn" onclick="selectBranch('CSE')">CSE</button>
                <button type="button" class="branch-btn" onclick="selectBranch('MECH')">MECH</button>
                <button type="button" class="branch-btn" onclick="selectBranch('CIVIL')">CIVIL</button>
            </div>

            <!-- Semester Buttons Section -->
            <div id="semesters" style="display: none;">
                <h3>Semesters - <span id="currentBranch">None</span></h3>
                <div id="semesterButtons">
                    <!-- Semester buttons will be dynamically added here -->
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer>
        Made by Hrudayesh Bhaskara
        <a href="https://github.com/HrudayeshB/GPA_Calculator" target="_blank"
            style="color: lightblue; text-decoration: none;">
            <i class="fab fa-github"></i>
        </a>
    </footer>
</body>

</html>
